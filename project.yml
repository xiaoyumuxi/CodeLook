name: CodeLook
options:
  bundleIdPrefix: dev.openres
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing: no developer account needed. Quick Look loads ad-hoc signed extensions
    # from apps registered on this Mac.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    GENERATE_INFOPLIST_FILE: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    # Lithe's syntax engine (make syntax): a Go shared library built for this Mac's architecture.
    # make dist overrides both with a universal (arm64 + x86_64) one. The app carries the only
    # copy (Contents/Frameworks); the extensions load it from there.
    ARCHS: $(NATIVE_ARCH_ACTUAL)
    LITHESYNTAX_DIR: $(PROJECT_DIR)/build/lithesyntax
    SWIFT_OBJC_BRIDGING_HEADER: $(LITHESYNTAX_DIR)/libLitheSyntax.h
    LIBRARY_SEARCH_PATHS: $(LITHESYNTAX_DIR)
    OTHER_LDFLAGS: -lLitheSyntax
targets:
  CodeLook:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      # JetBrains Mono, the default font (OFL), read from Contents/Resources/Fonts.
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      # config.example.yaml and its grammars; the app copies them to ~/.config/codelook on request.
      - path: Examples
        type: folder
        buildPhase: resources
      # The installer travels with the app: Contents/Resources/install.sh --refresh after
      # adding extensions to config.yaml.
      - path: scripts/install.sh
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: CodeLook
        PRODUCT_BUNDLE_IDENTIFIER: dev.openres.CodeLook
        INFOPLIST_FILE: App/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    # Signed here, before Xcode signs the app around it.
    postBuildScripts:
      - name: Embed the syntax engine
        script: |
          set -e
          dst="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$dst"
          cp -f "$LITHESYNTAX_DIR/libLitheSyntax.dylib" "$dst/libLitheSyntax.dylib"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --timestamp=none "$dst/libLitheSyntax.dylib"
        inputFiles:
          - $(LITHESYNTAX_DIR)/libLitheSyntax.dylib
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libLitheSyntax.dylib
    dependencies:
      - target: CodeLookPreview
        embed: true
        codeSign: true
      - target: CodeLookFallback
        embed: true
        codeSign: true

  CodeLookPreview:
    type: app-extension
    platform: macOS
    sources:
      - Extension/PreviewViewController.swift
      - Shared
      # JetBrains Mono, the default font (OFL), read from Contents/Resources/Fonts.
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: CodeLookPreview
        PRODUCT_BUNDLE_IDENTIFIER: dev.openres.CodeLook.Preview
        INFOPLIST_FILE: Extension/Preview-Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        # The engine in the host app: CodeLook.app/Contents/Frameworks.
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../../../../Frameworks"

  CodeLookFallback:
    type: app-extension
    platform: macOS
    sources:
      - Extension/PreviewViewController.swift
      - Shared
      # JetBrains Mono, the default font (OFL), read from Contents/Resources/Fonts.
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: CodeLookFallback
        PRODUCT_BUNDLE_IDENTIFIER: dev.openres.CodeLook.Fallback
        INFOPLIST_FILE: Extension/Fallback-Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        # The engine in the host app: CodeLook.app/Contents/Frameworks.
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../../../../Frameworks"
